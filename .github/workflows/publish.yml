name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, such as v0.1.0-alpha.3
        required: true
        type: string
      dry-run:
        description: Check and pack without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - name: Validate the tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must match vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Match the tag to the package version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          if ! grep -qF "'user-agent': 'prosaic-sdk/$VERSION'" src/transport.ts; then
            echo "::error::The user-agent in src/transport.ts is not prosaic-sdk/$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: yarn install --immutable
      - run: yarn generate:check
      - run: yarn test
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test:package
      - name: Pack
        run: |
          yarn pack --out prosaic-node.tgz
          tar -tzf prosaic-node.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: prosaic-node
          path: prosaic-node.tgz
          if-no-files-found: error

  publish:
    needs: check
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: prosaic-node
      - name: Publish
        env:
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
        run: npm publish prosaic-node.tgz --access public --tag "$DIST_TAG"
      - name: Verify the published version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "prosaic-node@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "Published prosaic-node@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::prosaic-node@$VERSION is not visible on the registry yet; check it before retrying"
